name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cargo.toml version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep '^version = ' worktree-dash-rs/Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match worktree-dash-rs/Cargo.toml version $CARGO_VERSION. Bump Cargo.toml before tagging."
            exit 1
          fi
          echo "Version match: $CARGO_VERSION"

  build:
    needs: verify-version
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: wt_darwin_arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: wt_darwin_amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: wt_linux_amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: worktree-dash-rs

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: worktree-dash-rs/target/${{ matrix.target }}/release/wt

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Bundle tarballs
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p dist

          for dir in artifacts/wt_*; do
            name=$(basename "$dir")
            # Extract os_arch from artifact name (wt_darwin_arm64 → darwin_arm64)
            os_arch=${name#wt_}

            tarball="wt_${VERSION}_${os_arch}.tar.gz"
            staging=$(mktemp -d)

            mkdir -p "$staging/bin" "$staging/share/wt"
            cp "$dir/wt" "$staging/bin/wt"
            chmod +x "$staging/bin/wt"
            cp -r worktree-flow "$staging/share/wt/worktree-flow"

            tar -czf "dist/$tarball" -C "$staging" bin share
            rm -rf "$staging"

            echo "Created dist/$tarball"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum wt_*.tar.gz > checksums.txt

      - name: Generate changelog
        id: changelog
        run: |
          prev_tag=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$prev_tag" ] || [ "$prev_tag" = "$GITHUB_REF_NAME" ]; then
            echo "body=Initial release" >> "$GITHUB_OUTPUT"
          else
            log=$(git log --oneline "$prev_tag".."$GITHUB_REF_NAME" --no-decorate)
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "body<<$EOF" >> "$GITHUB_OUTPUT"
            echo "$log" >> "$GITHUB_OUTPUT"
            echo "$EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/wt_*.tar.gz
            dist/checksums.txt

      - name: Notify homebrew-wt
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: elvisnm/homebrew-wt
          event-type: release
          client-payload: '{"version": "${{ steps.version.outputs.version }}", "tag": "${{ github.ref_name }}"}'
